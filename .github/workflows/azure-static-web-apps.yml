# Deploys the app to Azure Static Web Apps on every push to main.
#
# How it works:
#   1. Check out the code and run the unit tests. If the maths is broken,
#      the deploy never happens.
#   2. The Azure/static-web-apps-deploy action builds the Vite app
#      (npm ci + npm run build) and uploads dist/ to Azure.
#   3. Pull requests get a temporary "staging" preview site, which the
#      second job deletes when the PR is closed.
#
# One-time setup: add your Azure deployment token to the GitHub repo as a
# secret named AZURE_STATIC_WEB_APPS_API_TOKEN (see README.md → Deployment).
name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy:
    # Everything except closing a PR (that's handled by the job below).
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build, test and deploy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # caches dependencies between runs (needs package-lock.json)

      # Run the unit tests first. A red test suite stops the pipeline here,
      # so a broken build can never reach the live site.
      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test

      - name: Build and deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # used for PR staging comments
          action: upload
          app_location: "/" # where the source code lives in the repo
          output_location: "dist" # where `npm run build` puts the finished site
          skip_deploy_on_missing_secrets: true
          # No api_location: this app has no backend, it's all client-side.

  # When a PR is closed, remove its temporary preview site.
  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull request
    steps:
      - name: Close staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
